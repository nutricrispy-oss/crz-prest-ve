<style>
:root{--bg:#f1f5f4;--card:#fff;--tx:#0f1f1d;--mu:#64807b;--pr:#4338ca;--pr2:#6366f1;--ok:#16a34a;--okb:#dcfce7;--er:#dc2626;--erb:#fee2e2;--wa:#d97706;--wab:#fef3c7;--bd:#e2eceb;--sh:0 2px 10px rgba(15,60,55,.08)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#4338ca,#6366f1);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 26px 26px}

main{padding:0 14px;margin-top:-14px;max-width:640px;margin-inline:auto}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd)}
.nav{display:flex;align-items:center;gap:8px}
.nav button{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.nav input{flex:1;text-align:center;font-size:18px;font-weight:700}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.dia{text-align:center;color:var(--mu);margin-top:6px;text-transform:capitalize}
.kpi{display:flex;gap:10px}.kpi div{flex:1}.kpi small{color:var(--mu);display:block}.kpi b{font-size:22px}
.big{width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff;font-size:17px;font-weight:700;box-shadow:0 6px 16px rgba(67,56,202,.35)}
body.dark-fix .big{color:#0b0b2a}
@media(prefers-color-scheme:dark){.big{color:#0b0b2a}}
.big:disabled{opacity:.45;box-shadow:none}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .n{flex:1;min-width:0}.row .n b{display:block}.row .n small{color:var(--mu)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.c-ok{background:var(--okb);color:var(--ok)}.c-no{background:var(--erb);color:var(--er)}.c-pe{background:var(--wab);color:var(--wa)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 11px;font-weight:600;font-size:13px}
.btn.rev{color:var(--er);border-color:var(--er)}.btn.cob{color:var(--ok);border-color:var(--ok)}
.sun{background:var(--wab);color:var(--wa);padding:10px 12px;border-radius:12px;margin-bottom:10px;font-weight:600}
details summary{font-weight:700;cursor:pointer;padding:2px 0}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:7px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr2),var(--pr))}
.sp{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
h3{margin:4px 0 10px;font-size:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:6px 0;border-radius:12px}
.tabs button span{display:block;font-size:20px}.tabs button.on{color:var(--pr);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f1f1d;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}
.hid{display:none}.nt{color:var(--mu);font-size:13px;line-height:1.5;margin-bottom:12px}.lb{display:block;color:var(--mu);font-size:13px}.lb input{margin-top:4px;color:var(--tx)}.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.lock{position:fixed;inset:0;background:linear-gradient(135deg,#4338ca,#6366f1);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:12px;padding:20px;text-align:center}.lock input{max-width:230px;text-align:center;font-size:28px;letter-spacing:10px;color:#0f1f1d;background:#fff}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.sheet textarea{margin-top:4px}.ok{color:var(--ok)}.kg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kg small{color:var(--mu);display:block}.kg b{font-size:17px}.x{border:0;background:none;color:var(--er);font-size:18px;padding:4px 8px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet label{display:block;margin-bottom:10px;color:var(--mu);font-size:13px}.sheet label input,.sheet label select{margin-top:4px;color:var(--tx)}.sheet .chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}.sheet .chk input{width:auto;margin:0}.sm{padding:5px 9px;font-size:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mt{margin-top:10px}
</style>

<script>
const SEED={"c":[{"n":"Corredor 129","d":3150000,"q":28000,"cap":1000000,"a":true,"p":1890000,"g":["2025-06-11","2025-06-12","2025-06-13","2025-06-14","2025-06-16","2025-06-17",["2025-10-08",280000]]},{"n":"Corredor 169","d":49770000,"q":56000,"cap":2000000,"a":true,"p":47250000,"g":["2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17"]},{"n":"Corredor 89","d":10080000,"q":14000,"cap":500000,"a":true,"p":9450000,"g":["2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17"]},{"n":"Corredor 207","d":37580000,"q":50000,"cap":3000000,"a":true,"p":30555000,"g":[["2026-07-03",100000],["2026-07-04",100000],["2026-07-06",100000],["2026-07-07",100000],["2026-07-08",100000],["2026-07-09",100000],["2026-07-10",100000],["2026-07-11",100000],["2026-07-13",100000],["2026-07-15",100000],["2026-07-16",100000],["2026-07-17",100000],["2026-07-18",100000],["2026-07-20",100000],["2026-07-21",100000],["2026-07-22",100000],["2026-07-23",100000],["2026-08-13",75000],["2026-08-14",75000],["2026-08-17",75000],["2026-08-18",75000],["2026-08-19",75000],["2026-08-20",75000],["2026-08-21",75000],"2026-09-16","2026-09-17","2026-09-18","2026-09-19","2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-26","2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14"]},{"n":"Corredor 20","d":33987000,"q":59000,"cap":2100000,"a":true,"p":31332000,"g":["2026-10-15","2026-10-16","2026-10-17"]},{"n":"Corredor 39","d":15120000,"q":28000,"cap":1000000,"a":true,"p":13860000,"g":["2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13"]},{"n":"Corredor 163","d":19229000,"q":28000,"cap":1000000,"a":true,"p":17969000,"g":["2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17"]},{"n":"Corredor 37","d":10584000,"q":28000,"cap":1000000,"a":true,"p":9324000,"g":["2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17"]},{"n":"Corredor --","d":38430000,"q":28000,"cap":1000000,"a":false,"p":38430000,"g":[]},{"n":"Corredor 89-2","d":6300000,"q":19600,"cap":700000,"a":true,"p":5418000,"g":["2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11","2026-09-12","2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18","2026-09-19","2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-26","2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17"]},{"n":"Corredor -- (2)","d":7327000,"q":17000,"cap":600000,"a":false,"p":7327000,"g":[]},{"n":"Corredor 169,2","d":11582000,"q":28000,"cap":1000000,"a":true,"p":10322000,"g":["2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17"]},{"n":"Corredor 39,2","d":9765000,"q":28000,"cap":1000000,"a":true,"p":8505000,"g":["2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13"]},{"n":"Corredor 269,2","d":8820000,"q":56000,"cap":2000000,"a":true,"p":6300000,"g":["2026-09-24","2026-09-25","2026-09-26","2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02","2026-10-03","2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09","2026-10-10","2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16","2026-10-17"]}],"np":[],"h":{"2026-10-01":129000,"2026-10-02":129000,"2026-10-03":129000,"2026-10-05":56000,"2026-10-06":56000,"2026-10-07":87000,"2026-10-08":87000,"2026-10-09":87000,"2026-10-10":59000,"2026-10-12":59000,"2026-10-13":59000,"2026-10-14":9000},"r":[[2,500000,"2026-10-03"],[11,1000000,"2026-10-03"],[5,1000000,"2026-10-06"],[6,384000,"2026-10-09"],[4,625000,"2026-10-14"]]};
const KEY='crz_villa_v1';
const $=s=>document.querySelector(s);
const Gs=n=>'Gs. '+Math.round(n).toLocaleString('de-DE');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const dt=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const uid=()=>Math.random().toString(36).slice(2,9);
let S,view='hoy',fecha=iso(new Date());
const today=()=>iso(new Date());

function seed(){
  const corr=SEED.c.map((c,i)=>({id:'c'+i,nombre:c.n,deuda:c.d,cuota:c.q,activo:c.a,previo:c.p,cap:c.cap}));
  const pagos=[];
  SEED.c.forEach((c,i)=>c.g.forEach(g=>{const f=Array.isArray(g)?g[0]:g,m=Array.isArray(g)?g[1]:c.q;pagos.push({id:uid(),c:'c'+i,f,m})}));
  return {corr,pagos,nopago:SEED.np.map(x=>({c:'c'+x[0],f:x[1],m:x[2]})),hist:{...SEED.h},renov:SEED.r.map(x=>({id:uid(),c:'c'+x[0],m:x[1],f:x[2]})),retiros:[],gastos:[]};
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.corr){S=seed();save()}else{const d=seed();let ch=0;for(const k of['hist','renov','retiros','gastos'])if(!S[k]){S[k]=d[k];ch=1}if(ch)save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar')}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

const pagado=c=>c.previo+S.pagos.filter(p=>p.c===c.id&&p.f>=(c.desde||'')).reduce((a,p)=>a+p.m,0);
const saldo=c=>c.deuda-pagado(c);
const pagosDe=(c,f)=>S.pagos.filter(p=>p.c===c.id&&p.f===f);
const npDe=(c,f)=>S.nopago.find(p=>p.c===c.id&&p.f===f);
const totalDia=f=>S.pagos.filter(p=>p.f===f).reduce((a,p)=>a+p.m,0)+(S.hist[f]||0);
const activos=()=>S.corr.filter(c=>c.activo&&c.cuota>0&&saldo(c)>0);

function generar(f){
  if(dt(f).getDay()===0)return toast('Los domingos se carga solo manual');
  let n=0;
  activos().forEach(c=>{if(f>=(c.desde||'')&&!pagosDe(c,f).length&&!npDe(c,f)){S.pagos.push({id:uid(),c:c.id,f,m:Math.min(c.cuota,saldo(c))});n++}});
  save();render();toast(n?`${n} cobros generados`:'Ya estaba todo generado');
}
function revertir(cid,f){
  const c=S.corr.find(x=>x.id===cid),ps=pagosDe(c,f);if(!ps.length)return;
  const m=ps.reduce((a,p)=>a+p.m,0);
  if(!confirm(`¿Revertir el cobro de ${c.nombre} (${Gs(m)}) del ${fmt(f)}?\nSe marcará como NO PAGÓ.`))return;
  S.pagos=S.pagos.filter(p=>!(p.c===cid&&p.f===f));S.nopago.push({c:cid,f,m});
  save();render();toast('Cobro revertido · marcado como no pagó');
}
function cobrar(cid,f,m){
  const c=S.corr.find(x=>x.id===cid);m=m||Math.min(c.cuota,saldo(c));
  if(!(m>0))return toast('Monto inválido');
  S.nopago=S.nopago.filter(p=>!(p.c===cid&&p.f===f));
  S.pagos.push({id:uid(),c:cid,f,m,man:1});save();render();toast('Cobro registrado');
}

function mask(e){let v=e.target.value.replace(/\D/g,'').slice(0,8);if(v.length>4)v=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)v=v.slice(0,2)+'/'+v.slice(2);e.target.value=v}
function setFecha(v){const m=v.match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return toast('Fecha: dd/mm/aaaa');const s=`${m[3]}-${m[2]}-${m[1]}`;if(isNaN(dt(s))||iso(dt(s))!==s)return toast('Fecha inválida');fecha=s;render()}

function vHoy(){
  const dom=dt(fecha).getDay()===0,esHoy=fecha===today();
  const lista=S.corr.filter(c=>dom?(pagosDe(c,fecha).length||npDe(c,fecha)):(c.activo||pagosDe(c,fecha).length));
  const cobr=lista.filter(c=>pagosDe(c,fecha).length).length;
  let h=`<div class="card"><div class="nav"><button onclick="fecha=addD(fecha,-1);render()">‹</button>
  <input id="fi" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" value="${fmt(fecha)}" oninput="mask(event)" onchange="setFecha(this.value)" onfocus="this.select()">
  <button onclick="fecha=addD(fecha,1);render()">›</button></div>
  <div class="dia">${DIAS[dt(fecha).getDay()]}${esHoy?' · hoy':''}</div></div>
  <div class="card"><div class="kpi"><div><small>Cobrado del día</small><b>${Gs(totalDia(fecha))}</b></div><div><small>Cobrados</small><b>${cobr}/${lista.length}</b></div></div>
  <div class="mt">${dom?`<div class="sun">☀️ Domingo: solo carga manual, si hubiera cobros.</div>`:`<button class="big" onclick="generar(fecha)">⚡ Generar cobros ${esHoy?'de hoy':'del día'}</button>`}</div><button class="btn mt" style="width:100%" onclick="resumenDia()">📲 Resumen del día por WhatsApp</button></div>
  ${alertas()}<div class="card"><h3>Cobros del día</h3>`;
  if(!lista.length)h+=`<div class="sp">${dom?'Sin cobros cargados este domingo.':'Nada por mostrar.'}</div>`;
  lista.forEach(c=>{const ps=pagosDe(c,fecha),np=npDe(c,fecha),m=ps.reduce((a,p)=>a+p.m,0);
    h+=`<div class="row"><div class="n"><b>${c.nombre}</b><small>${ps.length?Gs(m):'Cuota '+Gs(c.cuota)}</small></div>
    ${ps.length?`<span class="chip c-ok">Cobrado</span><button class="btn rev" onclick="revertir('${c.id}','${fecha}')">Revertir</button>`
    :np?`<span class="chip c-no">No pagó</span><button class="btn cob" onclick="cobrar('${c.id}','${fecha}',${np.m})">Cobrar</button>`
    :`<span class="chip c-pe">Pendiente</span><button class="btn cob" onclick="cobrar('${c.id}','${fecha}')">Cobrar</button>`}</div>`});
  h+=`</div><div class="card"><details ${dom?'open':''}><summary>＋ Cobro manual</summary><div class="g2 mt">
  <select id="mc" onchange="$('#mm').value=S.corr.find(c=>c.id===this.value).cuota||''">${S.corr.filter(c=>saldo(c)>0).map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}</select>
  <input id="mm" inputmode="numeric" placeholder="Monto Gs." value="${(S.corr.find(c=>saldo(c)>0)||{}).cuota||''}"></div>
  <button class="big mt" onclick="const m=parseInt($('#mm').value.replace(/\\D/g,''));cobrar($('#mc').value,fecha,m)">Agregar cobro</button></details></div>`;
  return h;
}
function vAj(){
  const lb=lastB(),ask=ls.g(K_ASK)!=='0';
  return `${instalarCard()}${pinCard()}<div class="card"><h3>☁️ Respaldo en Google Drive</h3>
  <div class="sp">Último respaldo: <b class="${lb===today()?'ok':''}">${lb?fmt(lb)+(lb===today()?' (hoy ✓)':''):'nunca'}</b></div>
  <label class="chk" style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" style="width:auto" ${ask?'checked':''} onchange="toggleAsk(this.checked)"> Preguntar una vez al día al abrir la app</label>
  <div class="g2"><button class="big" style="padding:12px;font-size:15px" onclick="backupDrive()">Respaldar ahora</button><button class="btn" onclick="restoreDrive()">Restaurar de Drive</button></div>
  <details class="mt"><summary>Conectar mi Google Drive (una sola vez)</summary>
  <div class="sp mt">ID de cliente de Google:</div><input id="cid" class="mt" placeholder="xxxx.apps.googleusercontent.com" value="${gcid()}" onchange="saveCid(this.value)">
  <ol class="nt" style="padding-left:18px;margin:8px 0">
  <li>Entrá a console.cloud.google.com y creá un proyecto.</li><li>Menú «APIs y servicios» → «Biblioteca» → activá <b>Google Drive API</b>.</li>
  <li>«Pantalla de consentimiento OAuth» → tipo Externo → agregá tu Gmail como <b>usuario de prueba</b>.</li>
  <li>«Credenciales» → Crear → ID de cliente OAuth → Aplicación web.</li>
  <li>En «Orígenes autorizados de JavaScript» poné la dirección de tu app (ej. https://tuusuario.github.io).</li><li>Copiá el ID de cliente y pegalo arriba.</li></ol>

const K_CID='crz_gcid',K_LB='crz_villa_lastbackup',K_SNZ='crz_villa_snooze',K_ASK='crz_villa_askb';
const ls={g:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

let gTok=null,gExp=0;
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('sin conexión'));document.head.appendChild(s)})}
async function gToken(){
  if(gTok&&Date.now()<gExp)return gTok;
  await loadGIS();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:gcid(),scope:'https://www.googleapis.com/auth/drive.file',
      callback:r=>{if(r.error)return rej(new Error(r.error));gTok=r.access_token;gExp=Date.now()+(r.expires_in-60)*1000;res(gTok)},
      error_callback:e=>rej(new Error(e.type||'cancelado'))});
    tc.requestAccessToken();
  });
}
const FN='crz-villa-respaldo.json';
async function driveFind(H){
  const r=await fetch('https://www.googleapis.com/drive/v3/files?fields=files(id,modifiedTime)&q='+encodeURIComponent(`name='${FN}' and trashed=false`),{headers:H});
  if(!r.ok)throw new Error('Drive '+r.status);
  return ((await r.json()).files||[])[0];
}
async function backupDrive(){
  if(!gcid()){toast('Primero pegá el ID de cliente de Google en Ajustes');view='aj';render();return false}
  try{
    toast('Conectando con Google Drive…');
    const H={Authorization:'Bearer '+await gToken()},f=await driveFind(H),b='crzb'+uid();
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(f?{}:{name:FN})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${b}--`;
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(f?'/'+f.id:'')+'?uploadType=multipart',{method:f?'PATCH':'POST',headers:{...H,'Content-Type':'multipart/related; boundary='+b},body});
    if(!r.ok)throw new Error('Drive '+r.status);
    ls.s(K_LB,today());toast('✅ Copia guardada en Google Drive');if(view==='aj')render();return true;
  }catch(e){toast('No se pudo respaldar: '+e.message);return false}
}
async function restoreDrive(){
  if(!gcid())return toast('Primero pegá el ID de cliente de Google');
  try{
    const H={Authorization:'Bearer '+await gToken()},f=await driveFind(H);
    if(!f)return toast('No hay copia en Drive todavía');
    if(!confirm('Se reemplazarán los datos de este teléfono por la copia de Drive del '+fmt(iso(new Date(f.modifiedTime)))+'. ¿Continuar?'))return;
    const r=await fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{headers:H});
    if(!r.ok)throw new Error('Drive '+r.status);
    const d=await r.json();if(!d.corr||!d.pagos)throw new Error('archivo no válido');
    S=d;save();render();toast('Copia restaurada desde Drive');
  }catch(e){toast('No se pudo restaurar: '+e.message)}

function estado(c){
  const t=today(),pg=S.pagos.filter(p=>p.c===c.id&&p.f>=(c.desde||'')).map(p=>p.f).sort();
  const ini=c.desde||pg[0]||t,s=Math.max(saldo(c),0),q=c.cuota?Math.ceil(s/c.cuota):0;
  const base=(dt(t).getDay()===0||pagosDe(c,t).length||npDe(c,t))?t:addD(t,-1);
  const dias=Math.max(0,Math.round((dt(t)-dt(ini))/864e5))+1,sobra=CAP(c)-s;
  return {ini,dias,pagadas:new Set(pg).size,s,q,venc:q?nextCobro(base,q):t,sobra,cap:CAP(c)};
}

const diaReg=f=>S.pagos.some(p=>p.f===f)||S.nopago.some(p=>p.f===f)||S.hist[f]>0;
function mora(c){
  if(!c.activo||!c.cuota||saldo(c)<=0)return 0;
  const ini=iniCorr(c);let n=0,f=today();
  if(!npDe(c,f))f=addD(f,-1);
  for(let i=0;i<60;i++,f=addD(f,-1)){
    if(dt(f).getDay()===0)continue;
    if(f<ini||pagosDe(c,f).length)break;
    if(diaReg(f))n++;
  }
  return n;
}

const K_PIN='crz_villa_pin',K_PLEN='crz_villa_pinlen';
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('crz|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const ch of 'crz|'+s)h=(h*31+ch.charCodeAt(0))|0;return 'x'+h}}

  <div class="g2 mt">${on?`<button class="btn" onclick="pinDlg('cambiar')">Cambiar PIN</button><button class="btn rev" onclick="pinDlg('quitar')">Quitar PIN</button>`:`<button class="big" style="grid-column:span 2;padding:12px;font-size:15px" onclick="pinDlg('nuevo')">Activar PIN</button>`}</div></div>`;
}
function pinDlg(modo){
  const need=modo!=='nuevo',inp=(id,l)=>`<label>${l}<input id="${id}" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>`;
  const m=modal(`<h3>${{nuevo:'Activar PIN',cambiar:'Cambiar PIN',quitar:'Quitar PIN'}[modo]}</h3>${need?inp('p0','PIN actual'):''}${modo!=='quitar'?inp('p1','PIN nuevo (4 a 6 dígitos)')+inp('p2','Repetir PIN nuevo'):''}
  <div class="g2 mt"><button class="btn" id="px">Cancelar</button><button class="big" id="po" style="padding:11px">Guardar</button></div>`);
  m.querySelector('#px').onclick=()=>m.remove();
  m.querySelector('#po').onclick=async()=>{
    if(need&&await sha(m.querySelector('#p0').value)!==ls.g(K_PIN))return toast('PIN actual incorrecto');
    if(modo==='quitar'){ls.s(K_PIN,'');ls.s(K_PLEN,'');m.remove();render();return toast('PIN quitado')}
    const a=m.querySelector('#p1').value,b=m.querySelector('#p2').value;

  };
}
let locked=false,hiddenAt=0;
function lock(cb){
  if(locked||!ls.g(K_PIN))return;locked=true;
  const len=+ls.g(K_PLEN)||4,d=document.createElement('div');d.className='lock';
  d.innerHTML=`<div style="font-size:46px">🔒</div><h2 style="margin:0">CRz VILLA</h2><div>Ingresá tu PIN</div><input id="lp" type="password" inputmode="numeric" maxlength="${len}" autocomplete="off"><div id="lm" style="min-height:20px"></div><button class="btn" id="lf" style="background:transparent;color:#fff;border-color:#fff">Olvidé mi PIN</button>`;
  document.body.appendChild(d);const i=d.querySelector('#lp');setTimeout(()=>i.focus(),150);
  let fails=0,block=0;
  i.oninput=async()=>{
    if(i.value.length<len)return;

    if(await sha(i.value)===ls.g(K_PIN)){d.remove();locked=false;cb&&cb()}
    else{fails++;i.value='';d.querySelector('#lm').textContent=fails>=5?'Demasiados intentos. Esperá 30 segundos.':'PIN incorrecto';if(fails>=5){block=Date.now()+30000;fails=0}}
  };
  d.querySelector('#lf').onclick=()=>{
    if(!confirm('Se borrarán los datos de este teléfono y volverán los de la planilla original. Podés recuperar tu información desde tu copia de Drive o archivo. ¿Continuar?'))return;

  };
}

/* ===== Renovación automática y detalle de cuotas ===== */
const INTERES=0.26,NCUOTAS=45;
const fmtN=n=>{const s=String(n??'').replace(/\D/g,'');return s?s.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):''};
const nuevaDeuda=cap=>Math.round(cap*(1+INTERES));
const cuotaDe=d=>Math.round(d/NCUOTAS/100)*100;
function renovarCorr(id){
  const c=cget(id),deb=Math.max(saldo(c),0),qd=c.cuota?Math.ceil(deb/c.cuota):0,cap0=CAP(c)||0;
  openForm('Renovar '+esc(c.nombre),[
    {t:'note',html:`Debe actualmente: <b>${Gs(deb)}</b> (${qd} cuotas)<br>Interés: <b>${Math.round(INTERES*100)}%</b> · ${NCUOTAS} cuotas · cuota actual ${Gs(c.cuota)}`},
    {k:'m',l:'Monto renovado (efectivo entregado, Gs.)',t:'n',v:Math.max(cap0-deb,0)},
    {k:'d',l:'Nueva deuda total (Gs.)',t:'n',v:nuevaDeuda(cap0)},
    {k:'q',l:'Nueva cuota diaria (Gs.)',t:'n',v:c.cuota},
    {k:'cap',l:'Monto del nuevo préstamo (Gs.)',t:'n',v:cap0},
    {k:'f',l:'Fecha de renovación',t:'d',v:today()}],r=>{
    if(!r.d||!r.q){toast('Indicá nueva deuda y cuota');return false}
    if(r.m)S.renov.push({id:uid(),c:id,m:r.m,f:r.f});
    Object.assign(c,{deuda:r.d,cuota:r.q,cap:r.cap,previo:0,desde:addD(r.f,1),activo:true});save();render();toast('Préstamo renovado')},
  m=>{
    const g=k=>m.querySelector('#f_'+k),n=k=>parseInt(String(g(k).value).replace(/\D/g,''))||0,set=(k,v)=>{g(k).value=fmtN(v)};
    g('cap').addEventListener('input',()=>{const cap=n('cap'),d=nuevaDeuda(cap);set('d',d);set('q',cuotaDe(d));set('m',Math.max(cap-deb,0))});
    g('d').addEventListener('input',()=>set('q',cuotaDe(n('d'))));
  });
}

function cronograma(c,desde){
  const t=today(),s=Math.max(saldo(c),0),q=c.cuota?Math.ceil(s/c.cuota):0,rows=[];
  let f=desde,pend=0,g=0;
  while(g++<500){
    if(f>t&&pend>=q)break;
    const dom=dt(f).getDay()===0,ps=pagosDe(c,f),np=npDe(c,f);
    if(ps.length)rows.push({f,st:'ok',m:ps.reduce((a,p)=>a+p.m,0)});
    else if(!dom){
      if(np||(f<t&&diaReg(f)))rows.push({f,st:'no',m:c.cuota});
      else if(f<t)rows.push({f,st:'sr',m:c.cuota});
      else if(pend<q){rows.push({f,st:'pe',m:pend<q-1?c.cuota:s-c.cuota*(q-1)});pend++}
    }
    f=addD(f,1);
  }
  return rows;
}
function inicioDetalle(c){
  const t=today(),ini=iniCorr(c);let n=0,f=t;
  while(f>ini&&n<NCUOTAS){f=addD(f,-1);if(dt(f).getDay()!==0)n++}
  return f>ini?f:ini;
}
function resDetalle(c,rows){
  const r={ok:0,no:0,sr:0,pe:0,sOk:0,sPe:0};
  rows.forEach(x=>{r[x.st]++;if(x.st==='ok')r.sOk+=x.m;if(x.st==='pe')r.sPe+=x.m});
  const pe=rows.filter(x=>x.st==='pe');r.venc=pe.length?pe[pe.length-1].f:'';
  return r;
}
const STD={ok:['✅','Pagó','c-ok'],no:['❌','No pagó','c-no'],sr:['⚪','Sin registro','c-pe'],pe:['⏳','Pendiente','']};
function msgDetalle(c,rows){
  const r=resDetalle(c,rows),dia=f=>DIAS[dt(f).getDay()].slice(0,3);
  return `Hola ${c.nombre} 👋\nTe comparto el detalle de tus cuotas al ${fmt(today())}:\n\n💵 Cuota diaria: ${Gs(c.cuota)}\n✅ Pagadas: ${r.ok} (${Gs(r.sOk)})\n`+
  (r.no?`❌ Sin pagar: ${r.no}\n`:'')+(r.pe?`⏳ Pendientes: ${r.pe} (${Gs(r.sPe)})\n🗓️ Vencimiento estimado: ${fmt(r.venc)}\n`:'🎉 ¡Crédito saldado!\n')+'\n'+
  rows.map(x=>`${STD[x.st][0]} ${dia(x.f)} ${fmt(x.f).slice(0,5)} · ${x.st==='ok'||x.st==='pe'?Gs(x.m):STD[x.st][1].toLowerCase()}`).join('\n')+
  `\n\nCualquier consulta avisame 🙌`;
}
function detalleCuotas(id,desdeIn,telIn){
  const c=cget(id),desde=desdeIn||inicioDetalle(c),rows=cronograma(c,desde),r=resDetalle(c,rows);
  const m=modal(`<h3>📅 Detalle de cuotas · ${esc(c.nombre)}</h3>
  <div class="kg"><div><small>Pagadas</small><b class="ok">${r.ok} · ${Gs(r.sOk)}</b></div><div><small>No pagó</small><b style="color:${r.no?'var(--er)':'inherit'}">${r.no}</b></div>
  <div><small>Pendientes</small><b>${r.pe} · ${Gs(r.sPe)}</b></div><div><small>Vence aprox.</small><b>${r.venc?fmt(r.venc):'—'}</b></div></div>
  <label class="mt" style="display:block">Ver desde (dd/mm/aaaa)<input id="dd" inputmode="numeric" placeholder="dd/mm/aaaa" value="${fmt(desde)}" oninput="mask(event)"></label>
  <div style="margin:8px 0">${rows.map(x=>{const s=STD[x.st];return `<div class="row"><div class="n"><b>${fmt(x.f)}</b><small>${DIAS[dt(x.f).getDay()]}</small></div><b>${Gs(x.m)}</b>${x.st==='pe'?`<span class="chip" style="margin-left:8px;background:var(--bd);color:var(--mu)">${s[1]}</span>`:`<span class="chip ${s[2]}" style="margin-left:8px">${s[1]}</span>`}</div>`}).join('')||'<div class="sp">Sin cuotas para mostrar.</div>'}</div>
  <label style="display:block">WhatsApp del cliente (opcional)<input id="dt" inputmode="tel" placeholder="0981 123 456" value="${esc(telIn??c.tel??'')}"></label>
  <div class="g2 mt"><button class="btn" id="dc">Copiar</button><button class="big" id="ds" style="padding:11px">Enviar por WhatsApp</button></div><button class="btn mt" id="dx" style="width:100%">Cerrar</button>`);
  const tel=()=>m.querySelector('#dt').value;
  m.querySelector('#dd').addEventListener('change',e=>{
    const x=e.target.value.match(/^(\d\d)\/(\d\d)\/(\d{4})$/),s=x&&`${x[3]}-${x[2]}-${x[1]}`;
    if(!s||iso(dt(s))!==s)return toast('Fecha inválida (dd/mm/aaaa)');
    const t=tel();m.remove();detalleCuotas(id,s,t)});
  m.querySelector('#ds').onclick=()=>{if(tel()!==(c.tel||'')){c.tel=tel();save()}waOpen(msgDetalle(c,rows),tel())};
  m.querySelector('#dc').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(msgDetalle(c,rows)).then(()=>toast('Detalle copiado'),()=>toast('No se pudo copiar'))};
  m.querySelector('#dx').onclick=()=>m.remove();
}

/* ===== Historial por fechas ===== */
const APPN='CRz VILLA';
let hf=null;
const iniMes=f=>f.slice(0,8)+'01';
const hfGet=()=>hf||(hf={d:iniMes(today()),h:today()});
function hfSet(k,v){
  const x=v.match(/^(\d\d)\/(\d\d)\/(\d{4})$/),s=x&&`${x[3]}-${x[2]}-${x[1]}`;
  if(!s||iso(dt(s))!==s)return toast('Fecha inválida (dd/mm/aaaa)');
  hfGet()[k]=s;if(hf.d>hf.h){const a=hf.d;hf.d=hf.h;hf.h=a}render();
}
function hfRapido(t){
  const h=today();
  if(t==='mes')hf={d:iniMes(h),h};
  else if(t==='ant'){const u=addD(iniMes(h),-1);hf={d:iniMes(u),h:u}}
  else if(t==='7')hf={d:addD(h,-6),h};
  else hf={d:addD(h,-30),h};
  render();
}
function datosHist(){
  const {d,h}=hfGet(),fin=h>today()?today():h,rows=[];let f=d,g=0;
  while(f<=fin&&g++<400){rows.push({f,t:totalDia(f),np:S.nopago.filter(p=>p.f===f).length});f=addD(f,1)}
  const inR=x=>x.f>=d&&x.f<=h;
  return {d,h,rows,cob:rows.reduce((a,x)=>a+x.t,0),np:rows.reduce((a,x)=>a+x.np,0),dias:rows.filter(x=>x.t>0).length,
    ren:S.renov.filter(inR).reduce((a,x)=>a+x.m,0),nop:S.nopago.filter(inR).sort((a,b)=>b.f.localeCompare(a.f))};
}
function vHist(){
  const x=datosHist(),chip=(k,t)=>`<button class="btn sm" onclick="hfRapido('${k}')">${t}</button>`;
  let h=`<div class="card"><h3>Filtrar por fechas</h3><div class="g2">
  <label class="lb">Desde<input inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" value="${fmt(x.d)}" oninput="mask(event)" onchange="hfSet('d',this.value)"></label>
  <label class="lb">Hasta<input inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" value="${fmt(x.h)}" oninput="mask(event)" onchange="hfSet('h',this.value)"></label></div>
  <div class="chips mt">${chip('mes','Este mes')}${chip('ant','Mes pasado')}${chip('7','7 días')}${chip('31','31 días')}</div></div>
  <div class="card"><div class="kg"><div><small>Total cobrado</small><b>${Gs(x.cob)}</b></div><div><small>Renovados</small><b>${Gs(x.ren)}</b></div>
  <div><small>Días con cobro</small><b>${x.dias}</b></div><div><small>No pagó</small><b>${x.np}</b></div></div>
  <button class="big mt" onclick="waHist()">📲 Enviar detalle por WhatsApp</button></div>
  <div class="card"><h3>Detalle por día</h3>`;
  [...x.rows].reverse().forEach(r=>{
    h+=`<div class="row" onclick="fecha='${r.f}';view='hoy';render()"><div class="n"><b>${fmt(r.f)}</b><small>${DIAS[dt(r.f).getDay()]}${r.np?' · '+r.np+' no pagó':''}</small></div><b>${r.t?Gs(r.t):'—'}</b></div>`});
  if(!x.rows.length)h+=`<div class="sp">No hay días en este rango.</div>`;
  h+=`</div><div class="card"><h3>No pagó (${x.nop.length})</h3>`;
  if(!x.nop.length)h+=`<div class="sp">Sin registros en este período.</div>`;
  x.nop.slice(0,60).forEach(p=>{const c=S.corr.find(k=>k.id===p.c);h+=`<div class="row"><div class="n"><b>${c?esc(c.nombre):'—'}</b><small>${fmt(p.f)}</small></div><span>${Gs(p.m)}</span></div>`});
  if(x.nop.length>60)h+=`<div class="sp mt">Se muestran los 60 más recientes.</div>`;
  return h+`</div>`;
}
function msgHist(){
  const x=datosHist(),dia=f=>DIAS[dt(f).getDay()].slice(0,3);
  const lines=x.rows.filter(r=>r.t>0||r.np>0).map(r=>`${dia(r.f)} ${fmt(r.f).slice(0,5)} · ${r.t?Gs(r.t):'sin cobros'}${r.np?' · '+r.np+' no pagó':''}`);
  return `📊 ${APPN}\nCobros del ${fmt(x.d)} al ${fmt(x.h)}\n\n💰 Total cobrado: ${Gs(x.cob)}\n🔄 Renovados: ${Gs(x.ren)}\n📅 Días con cobro: ${x.dias}\n`+(x.np?`❌ No pagó: ${x.np}\n`:'')+
  `\n`+(lines.join('\n')||'Sin movimientos en este período.')+`\n\nGenerado el ${fmt(today())}`;
}
function waHist(){
  const m=modal(`<h3>📲 Enviar detalle</h3><label class="lb">WhatsApp (opcional; si lo dejás vacío elegís el contacto)<input id="ht" inputmode="tel" placeholder="0981 123 456"></label>
  <label class="lb mt">Mensaje (podés editarlo)<textarea id="hm" rows="12" style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit">${esc(msgHist())}</textarea></label>
  <div class="g2 mt"><button class="btn" id="hc">Copiar</button><button class="big" id="hs" style="padding:11px">Enviar</button></div><button class="btn mt" id="hx" style="width:100%">Cerrar</button>`);
  const val=()=>m.querySelector('#hm').value;
  m.querySelector('#hs').onclick=()=>waOpen(val(),m.querySelector('#ht').value);
  m.querySelector('#hc').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(val()).then(()=>toast('Detalle copiado'),()=>toast('No se pudo copiar'))};
  m.querySelector('#hx').onclick=()=>m.remove();
}

const TABS=[['hoy','📅','Hoy'],['corr','👥','Corredores'],['caja','💰','Caja'],['hist','🕘','Historial'],['aj','⚙️','Ajustes']];
function render(){
  $('#sub').textContent=DIAS[new Date().getDay()]+' '+fmt(today());
  $('#app').innerHTML={hoy:vHoy,corr:vCorr,caja:vCaja,hist:vHist,aj:vAj}[view]();
  $('#tabs').innerHTML=TABS.map(t=>`<button class="${t[0]===view?'on':''}" onclick="view='${t[0]}';render();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('');
}
load();render();if(ls.g(K_PIN))lock(()=>setTimeout(askBackup,400));else setTimeout(askBackup,700);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
